# Static verification: analyzer, full test suite, trusted-source links,
# independent ethers.js cold-signature verification, secret scan, and SBOM
# freshness. No release builds here — the deb/APK release line is built and
# signed locally by the maintainer (scripts/build-deb.sh, scripts/build-apk.sh).
name: verify
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: No keystores or private keys tracked
        run: bash scripts/secret-scan.sh

  flutter:
    runs-on: ubuntu-latest
    # The full suite includes deliberately expensive, production-parameter
    # Argon2id KDF cases. Keep them in the required check, with enough time
    # for a serial run on a hosted runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: bash scripts/test-suite.sh
      - name: Dependency advisory audit
        run: python3 scripts/dependency-audit.py

  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - run: flutter pub get
      - name: Build Linux release bundle from source
        run: flutter build linux --release

  cold-signature:
    # Independent of Dart: parses the exact signed bytes with ethers.js and
    # recovers the signer with a separate secp256k1 implementation.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: verification
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: verification/package-lock.json
      - run: npm ci
      - name: npm dependency advisory audit
        run: npm audit --audit-level=low
      - run: node verify.cjs

  sources-and-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/check_token_sources.py
      - run: python3 scripts/sbom.py --out docs/SBOM.json
      - name: SBOM must be committed and current
        run: |
          git diff --exit-code docs/SBOM.json || {
            echo "::error ::docs/SBOM.json is stale — regenerate with scripts/sbom.py"
            exit 1
          }
